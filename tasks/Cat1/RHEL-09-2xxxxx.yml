---

- name: HIGH | RHEL-09-211010 | AUDIT | RHEL 9 must be a vendor-supported release.
  when: rhel_09_211010
  tags:
    - RHEL-09-211010
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-257777r1155676_rule
    - V-257777
    - NIST800-53R4_CM-6
  ansible.builtin.debug:
    msg: Minimum supported version of {{ ansible_facts.distribution }} is {{ rhel9stig_min_supported_os_ver[ansible_facts.distribution] }}
  changed_when: ansible_facts.distribution_version is not version_compare(rhel9stig_min_supported_os_ver[ansible_facts.distribution], '>=')

- name: HIGH | RHEL-09-211045 | PATCH | The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled
  when: rhel_09_211045
  tags:
    - RHEL-09-211045
    - CAT1
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SRG-OS-000480-GPOS-00227
    - SV-257784r1155651_rule
    - V-257784
    - NIST800-53R4_AC-6
  notify: Systemd_daemon_reload
  block:
    - name: HIGH | RHEL-09-211045 | PATCH | The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled | ansible.builtin.systemd
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d/
        state: directory
        mode: 'go-w'
        owner: root
        group: root

    - name: HIGH | RHEL-09-211045 | PATCH | The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled | ansible.builtin.lineinfile
      ansible.builtin.template:
        src: etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.j2
        dest: /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction
        mode: 'go-wx'
        owner: root
        group: root

    - name: HIGH | RHEL-09-211045 | PATCH | The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled | ansible.builtin.lineinfile
      ansible.builtin.lineinfile:
        path: /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction
        regexp: ^CtrlAltDelBurstAction=none
        line: CtrlAltDelBurstAction=none
        create: true
        mode: 'go-wx'

- name: HIGH | RHEL-09-211050 | PATCH | The x86 Ctrl-Alt-Delete key sequence must be disabled on RHEL 9
  when: rhel_09_211050
  tags:
    - RHEL-09-211050
    - CAT1
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SRG-OS-000480-GPOS-00227
    - SV-257785r1044833_rule
    - V-257785
    - NIST800-53R4_CM-6
    - NIST800-53R4_AC-6
  notify: Systemd_daemon_reload
  block:
    - name: HIGH | RHEL-09-211050 | PATCH | The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled | Create symlink to /dev/null
      ansible.builtin.file:
        src: /dev/null
        dest: /etc/systemd/system/ctrl-alt-del.target
        state: link

    - name: HIGH | RHEL-09-211050 | PATCH | The systemd Ctrl-Alt-Delete burst key sequence in RHEL 9 must be disabled | systemctl disable
      ansible.builtin.systemd:
        name: ctrl-alt-del.target
        masked: true
        state: stopped

- name: HIGH | RHEL-09-212020 | PATCH | RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes.
  when: rhel_09_212020
  tags:
    - RHEL-09-212020
    - CAT1
    - CCI-000213
    - SRG-OS-000080-GPOS-00048
    - SV-257789r1137691_rule
    - V-257789
    - NIST800-53R4_AC-3
    - grub
  block:
    - name: HIGH | RHEL-09-212020 | PATCH | RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes. | Set superusers name
      notify: Rebuild_grub
      ansible.builtin.lineinfile:
        path: /etc/grub.d/01_users
        regexp: '^(\s*set superusers=).*$'
        line: '\1"{{ rhel9stig_grub_superuser }}"'
        backrefs: true

    - name: HIGH | RHEL-09-212020 | PATCH | RHEL 9 must require a unique superusers name upon booting into single-user and maintenance modes. | Align password_pbkdf2 user to the superuser
      when: rhel9stig_set_bootloader_password
      notify: Rebuild_grub
      ansible.builtin.replace:
        path: /etc/grub.d/01_users
        regexp: '^(\s*password_pbkdf2\s+)\S+'
        replace: '\1{{ rhel9stig_grub_superuser }}'

- name: HIGH | RHEL-09-214015 | PATCH | RHEL 9 must check the GPG signature of software packages originating from external software repositories before installation.
  when: rhel_09_214015
  tags:
    - RHEL-09-214015
    - CAT1
    - CCI-001749
    - SRG-OS-000366-GPOS-00153
    - SV-257820r1044878_rule
    - V-257820
    - NIST800-53R4_CM-5
    - dnf
    - packages
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: ^gpgcheck
    line: gpgcheck=1

- name: HIGH | RHEL-09-214020 | PATCH | RHEL 9 must have GPG signature verification enabled for all software repositories.
  when: rhel_09_214020
  tags:
    - RHEL-09-214020
    - CAT1
    - CCI-001749
    - SRG-OS-000366-GPOS-00153
    - SV-257821r1015077_rule
    - V-257821
    - NIST800-53R4_CM-5
    - dnf
    - packages
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: ^localpkg_gpgcheck
    line: localpkg_gpgcheck=1

- name: HIGH | RHEL-09-214025 | PATCH | RHEL 9 must have GPG signature verification enabled for all software repositories.
  when: rhel_09_214025
  tags:
    - RHEL-09-214025
    - CAT1
    - CCI-001749
    - SRG-OS-000366-GPOS-00153
    - SV-257822r1155615_rule
    - V-257822
    - NIST800-53R4_CM-5
    - dnf
    - packages
  block:
    - name: HIGH | RHEL-09-214025 | PATCH | RHEL 9 must have GPG signature verification enabled for all software repositories. | find repo files
      ansible.builtin.find:
        path: /etc/yum.repos.d
        patterns: "*.repo"
        contains: gpgcheck
        file_type: file
      register: discovered_repo_list

    - name: HIGH | RHEL-09-214025 | PATCH | RHEL 9 must have GPG signature verification enabled for all software repositories. | Set gpgcheck
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: ^gpgcheck\s*=.*$
        replace: gpgcheck=1
      loop: "{{ discovered_repo_list.files }}"

- name: HIGH | RHEL-09-215015 | PATCH | RHEL 9 must not have a File Transfer Protocol (FTP) server package installed.
  when:
    - not rhel9stig_is_ftp_server
    - rhel_09_215015
  tags:
    - RHEL-09-215015
    - CAT1
    - CCI-000197
    - CCI-000381
    - SRG-OS-000074-GPOS-00042
    - SRG-OS-000095-GPOS-00049
    - SRG-OS-000480-GPOS-00227
    - SV-257826r1106299_rule
    - V-257826
    - NIST800-53R4_IA-5
    - NIST800-53R4_CM-6
    - NIST800-53R4_CM-7
  ansible.builtin.package:
    name: vsftpd
    state: absent

- name: HIGH | RHEL-09-215060 | PATCH | The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode..
  when: rhel_09_215060
  tags:
    - RHEL-09-215060
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-257835r1155679_rule
    - V-257835
    - NIST800-53R4_CM-6
    - tftp
  block:
    - name: HIGH | RHEL-09-215060 | PATCH | The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode. | Get tftp-server package
      when: not rhel9stig_is_tftp_server
      ansible.builtin.package:
        name: tftp-server
        state: absent

    # Written as a systemd drop-in rather than an edit to the RPM-owned unit under
    # /usr/lib/systemd/system/. Modifying the vendor unit changes its hash and makes
    # RHEL-09-214030's `rpm -Va` integrity check report a finding - the same conflict
    # RHEL-09-611195/611200 were changed to avoid. The bare `ExecStart=` line is required:
    # ExecStart is a list-type directive, so it must be reset before being redefined.
    - name: HIGH | RHEL-09-215060 | PATCH | The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode. | create drop-in directory
      when: rhel9stig_is_tftp_server
      ansible.builtin.file:
        path: /etc/systemd/system/tftp.service.d
        owner: root
        group: root
        mode: 'u,go-w'
        state: directory

    - name: HIGH | RHEL-09-215060 | PATCH | The Trivial File Transfer Protocol (TFTP) server must not be installed unless it is required, and if required, the RHEL 9 TFTP daemon must be configured to operate in secure mode. | deploy secure-mode drop-in
      when: rhel9stig_is_tftp_server
      ansible.builtin.template:
        src: etc/systemd/system/tftp.service.d/tftp.service.conf.j2
        dest: /etc/systemd/system/tftp.service.d/tftp.service.conf
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify: Systemd_daemon_reload

