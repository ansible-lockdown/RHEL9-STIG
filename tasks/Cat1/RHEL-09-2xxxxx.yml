- name: "HIGH | RHEL-09-215105 | PATCH | RHEL 9 must implement a FIPS 140-3 compliant systemwide cryptographic policy"
  when: rhel_09_215105
  tags:
    - RHEL-09-215105
    - CAT1
    - CCI-002450
    - CCI-002890
    - CCI-003123
    - SRG-OS-000396-GPOS-00176
    - SRG-OS-000393-GPOS-00173
    - SRG-OS-000394-GPOS-00174
    - SV-258241r1184293_rule
    - V-258241
    - NIST800-53R4_SC-13
    - NIST800-53R4_MA-4
    - fips
    - encryption
  notify: Change_requires_reboot
  block:
    - name: "HIGH | RHEL-09-215105 | AUDIT | RHEL 9 must implement a FIPS 140-3 compliant systemwide cryptographic policy | Get crypto state"
      ansible.builtin.command: update-crypto-policies --show
      changed_when: false
      failed_when: discovered_crypto_policies_check.rc not in [0 , 1]
      register: discovered_crypto_policies_check

    - name: "HIGH | RHEL-09-215105 | PATCH | RHEL 9 must implement a FIPS 140-3 compliant systemwide cryptographic policy | Add required pmod files"
      when: rhel9stig_disruption_high
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/{{ item }}"
        owner: root
        group: root
        mode: "u-x,go-rwx"
      loop:
        - etc/crypto-policies/policies/modules/SCOPES-AND-WILDCARDS.pmod
        - etc/crypto-policies/policies/modules/OPENSSH-SUBPOLICY.pmod
        - etc/crypto-policies/policies/modules/REQUIRE.pmod

    - name: "HIGH | RHEL-09-215105 | PATCH | RHEL 9 must implement a FIPS 140-3 compliant systemwide cryptographic policy | set FIPS"
      when:
        - "combined_crypto_policy_config != discovered_crypto_policies_check.stdout"
        - rhel9stig_disruption_high
      ansible.builtin.command: "update-crypto-policies --set {{ combined_crypto_policy_config }}"
      changed_when: true
      notify: Change_requires_reboot

    - name: "HIGH | RHEL-09-215105 | WARN | RHEL 9 must implement a FIPS 140-3 compliant systemwide cryptographic policy"
      when:
        - "combined_crypto_policy_config != discovered_crypto_policies_check.stdout"
        - not rhel9stig_disruption_high
      ansible.builtin.debug:
        msg: "WARNING!! - Crypto-Policies is not set to {{ combined_crypto_policy_config }} only - Current {{ discovered_crypto_policies_check.stdout }}"

    - name: "HIGH | RHEL-09-215105 | WARN | RHEL 9 must implement a FIPS 140-3 compliant systemwide cryptographic policy"
      when:
        - "combined_crypto_policy_config != discovered_crypto_policies_check.stdout"
        - not rhel9stig_disruption_high
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "HIGH | RHEL-09-215105"

- name: HIGH | RHEL-09-231190 | AUDIT | All RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection.
  when: rhel_09_231190
  tags:
    - RHEL-09-231190
    - CAT1
    - CCI-001199
    - CCI-002475
    - CCI-002476
    - SRG-OS-000405-GPOS-00184
    - SRG-OS-000185-GPOS-00079
    - SRG-OS-000404-GPOS-00183
    - SV-257879r1045454_rule
    - V-257879
    - NIST800-53R4_SC-28
    - encrypt
    - filesystem
  block:
    - name: HIGH | RHEL-09-231190 | AUDIT | All RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | Get partition layout
      ansible.builtin.command: blkid
      changed_when: false
      failed_when: false
      register: discovered_partition_layout

    - name: HIGH | RHEL-09-231190 | WARN | All RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | Message out warning
      ansible.builtin.debug:
        msg:
          - WARNING!! Below is the partition layout. Please run the "blkid" command to confirm every persistent disk partition has an entry for TYPE=crypto_LUKS.
          - If partitions other than pseudo file systems (such as /proc or /sys or tmpfs) this is a finding
          - "{{ discovered_partition_layout.stdout_lines }}"

    - name: HIGH | RHEL-09-231190 | WARN | All RHEL 9 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | Message out warning
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "HIGH | RHEL-09-231190"

- name: HIGH | RHEL-09-252070 | PATCH | There must be no shosts.equiv files on RHEL 9.
  when: rhel_09_252070
  tags:
    - RHEL-09-252070
    - CAT1
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-257955r991589_rule
    - V-257955
    - NIST800-53R4_CM-6
    - files
  block:
    - name: HIGH | RHEL-09-252070 | AUDIT | There must be no shosts.equiv files on RHEL 9. | find files
      ansible.builtin.find:
        path: /
        pattern: shosts.equiv
      register: discovered_shosts_equiv

    - name: HIGH | RHEL-09-252070 | PATCH | There must be no shosts.equiv files on RHEL 9. | Remove files
      when:
        - discovered_shosts_equiv.files | length > 0
        - rhel9stig_disruption_high
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ discovered_shosts_equiv.files }}"

    - name: HIGH | RHEL-09-252070 | WARN | There must be no shosts.equiv files on RHEL 9. | Warn if not removing files found
      when:
        - discovered_shosts_equiv.files | length > 0
        - not rhel9stig_disruption_high
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "HIGH | RHEL-09-252070"

