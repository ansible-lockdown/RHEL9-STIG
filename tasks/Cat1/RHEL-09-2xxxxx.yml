- name: HIGH | RHEL-09-255040 | PATCH | RHEL 9 SSHD must not allow blank passwords.
  when:
    - rhel_09_255040
    - rhel9stig_sshd_required
  tags:
    - RHEL-09-255040
    - CAT1
    - CCI-000766
    - SRG-OS-000106-GPOS-00053
    - SRG-OS-000480-GPOS-00229
    - SRG-OS-000480-GPOS-00227
    - SV-257984r1045026_rule
    - V-257984
    - NIST800-53R4_IA-2
    - ssh
  notify: Restart_sshd
  ansible.builtin.lineinfile:
    path: "{{ rhel9stig_sshd_config_file }}"
    regexp: (?i)^(#|)PermitEmptyPasswords yes
    line: PermitEmptyPasswords no
    validate: sshd -t -f %s

- name: HIGH | RHEL-09-255050 | PATCH | RHEL 9 must enable the Pluggable Authentication Module (PAM) interface for SSHD.
  when:
    - rhel_09_255050
    - rhel9stig_sshd_required
  tags:
    - RHEL-09-255050
    - CAT1
    - CCI-000877
    - SRG-OS-000125-GPOS-00065
    - SV-257986r1045030_rule
    - V-257986
    - NIST800-53R4_MA-4
    - ssh
    - pam
  notify: Restart_sshd
  ansible.builtin.lineinfile:
    path: "{{ rhel9stig_sshd_config_file }}"
    regexp: (?i)^(#|)usepam
    line: UsePAM yes
    validate: sshd -t -f %s

- name: "HIGH | RHEL-09-255064 | PATCH | The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
  when:
    - rhel_09_255064
    - rhel9stig_sshd_required
  tags:
    - RHEL-09-255064
    - CAT1
    - CCI-001453
    - SRG-OS-000250-GPOS-00093
    - SV-270177r1184308_rule
    - V-270177
    - NIST800-53R4_AC-17
  block:
    - name: "HIGH | RHEL-09-255064 | AUDIT | The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. | capture current"
      ansible.builtin.command: grep -i Ciphers /etc/crypto-policies/back-ends/openssh.config
      changed_when: false
      register: discovered_openssh_ciphers

    - name: "HIGH | RHEL-09-255064 | PATCH | The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections. | Correct if wrong"
      when:
        - rhel9stig_disruption_high
        - "(rhel9stig_dod_ciphers | join (',')) not in discovered_openssh_ciphers.stdout"
      ansible.builtin.debug:
        msg: "Crypto policies being reinstalled as handler"
      notify: Reinstall_crypto_policies

    - name: "HIGH | RHEL-09-255064 | WARN | The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
      when:
        - not rhel9stig_disruption_high
        - "(rhel9stig_dod_ciphers | join (',')) not in discovered_openssh_ciphers.stdout"
      ansible.builtin.debug:
        msg: "Warning!! Investigate /etc/crypto-policies/back-ends/openssh.config for correct IPS 140-3 ciphers and order"

    - name: "HIGH | RHEL-09-255064 | WARN | The RHEL 9 SSH client must be configured to use only DOD-approved encryption ciphers employing FIPS 140-3 validated cryptographic hash algorithms to protect the confidentiality of SSH client connections."
      when:
        - not rhel9stig_disruption_high
        - "(rhel9stig_dod_ciphers | join (',')) not in discovered_openssh_ciphers.stdout"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "HIGH | RHEL-09-255064"

