---
# Preliminary tasks that should always be run
# List users in order to look files inside each home directory

- name: PRELIM | Discover Interactive UID MIN and MIN from logins.def
  tags: always
  block:
    - name: PRELIM | Capture UID_MIN information from logins.def
      ansible.builtin.shell: |
        set -o pipefail
        grep -w "^UID_MIN" /etc/login.defs | awk '{print $NF}'
      args:
        executable: "{{ rhel9stig_shell_executable }}"
      changed_when: false
      register: prelim_uid_min_id

    - name: PRELIM | Capture UID_MAX information from logins.def
      ansible.builtin.shell: |
        set -o pipefail
        grep -w "^UID_MAX" /etc/login.defs | awk '{print $NF}'
      args:
        executable: "{{ rhel9stig_shell_executable }}"
      changed_when: false
      register: prelim_uid_max_id

    - name: PRELIM | Set_facts for interactive uid/gid
      ansible.builtin.set_fact:
        min_int_uid: "{{ prelim_uid_min_id.stdout }}"
        max_int_uid: "{{ prelim_uid_max_id.stdout }}"

- name: PRELIM | Capture /etc/password variables
  tags: always
  ansible.builtin.include_tasks:
    file: parse_etc_passwd.yml

- name: PRELIM | Interactive Users
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    grep -Ev 'nologin|/sbin' /etc/passwd | awk -F: '$3 >= {{ min_int_uid }} {print $1}'
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  register: prelim_interactive_users

- name: Include pre-remediation audit tasks
  when:
    - run_audit or audit_only
    - setup_audit
  tags:
    - run_audit
    - molecule-idempotence-notest
  ansible.builtin.import_tasks:
    file: pre_remediation_audit.yml

- name: PRELIM | Interactive User account home
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    cat /etc/passwd | grep -Ev "nologin|/sbin" | cut -d: -f6
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  register: prelim_interactive_users_home

- name: PRELIM | Set crypto policies and subpolicies fact
  when: rhel9stig_additional_fips_crypto_subpolicies
  tags: always
  ansible.builtin.set_fact:
    combined_crypto_policy_config: "{{ combined_crypto_policy_config }}:{{ rhel9stig_additional_fips_crypto_subpolicies_list | join(':') }}"

- name: PRELIM | Gather accounts with empty password fields
  when: rhel_09_611155
  tags: passwords
  ansible.builtin.shell: |
    set -o pipefail
    cat /etc/shadow | awk -F: '($2 == "" ) {j++;print $1; } END {exit j}'
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  failed_when: prelim_empty_password_accounts.rc not in [ 0, 1 ]
  no_log: true
  register: prelim_empty_password_accounts

- name: PRELIM | Gather UID 0 accounts other than root
  tags:
    - level1-server
    - level1-workstation
    - users
  ansible.builtin.shell: |
    set -o pipefail
    cat /etc/passwd | awk -F: '($3 == 0 && $1 != "root") {i++;print $1 } END {exit i}'
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  check_mode: false
  register: prelim_uid_zero_accounts_except_root

- name: PRELIM | Create list of mount points
  tags: always
  ansible.builtin.set_fact:
    mount_names: "{{ ansible_facts['mounts'] | map(attribute='mount') | list }}"

- name: PRELIM | Ensure python3-libselinux is installed
  when:
    - '"python3-libselinux" not in ansible_facts.packages'
    - not system_is_container
  ansible.builtin.package:
    name: python3-libselinux
    state: present

- name: PRELIM | Set facts based on boot type
  tags: always
  block:
    - name: PRELIM | Check whether machine is UEFI-based
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: prelim_efi_boot

    - name: PRELIM | Set legacy boot and grub path | Bios
      when: not prelim_efi_boot.stat.exists
      ansible.builtin.set_fact:
        rhel9stig_legacy_boot: true

- name: PRELIM | Update to latest gpg keys
  when:
    - ansible_facts.distribution != 'RedHat'
    - ansible_facts.distribution != 'OracleLinux'
  ansible.builtin.package:
    name: "{{ gpg_key_package }}"
    state: latest

- name: PRELIM | Configure System Accounting (auditd)
  when:
    - rhel9stig_auditd_required
    - '"auditd" not in ansible_facts.packages'
  tags:
    - cat2
    - SRG-OS-000062-GPOS-00031
    - SRG-OS-000037-GPOS-00015
    - SRG-OS-000038-GPOS-00016
    - SRG-OS-000039-GPOS-00017
    - SRG-OS-000040-GPOS-00018
    - SRG-OS-000041-GPOS-00019
    - SRG-OS-000042-GPOS-00021
    - SRG-OS-000051-GPOS-00024
    - SRG-OS-000054-GPOS-00025
    - SRG-OS-000122-GPOS-00063
    - SRG-OS-000254-GPOS-00095
    - SRG-OS-000255-GPOS-00096
    - SRG-OS-000337-GPOS-00129
    - SRG-OS-000348-GPOS-00136
    - SRG-OS-000349-GPOS-00137
    - SRG-OS-000350-GPOS-00138
    - SRG-OS-000351-GPOS-00139
    - SRG-OS-000352-GPOS-00140
    - SRG-OS-000353-GPOS-00141
    - SRG-OS-000354-GPOS-00142
    - SRG-OS-000358-GPOS-00145
    - SRG-OS-000365-GPOS-00152
    - SRG-OS-000392-GPOS-00172
    - SRG-OS-000475-GPOS-00220
    - auditd
  ansible.builtin.package:
    name: audit
    state: present

- name: "PRELIM | Discover auditd_logfile_path"
  when:
    - rhel9stig_auditd_required
    - rhel_09_653085 or
      rhel_09_653085 or
      rhel_09_653090
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  register: discovered_auditd_logfile

- name: "PRELIM | Discover auditd rules files"
  when:
    - rhel9stig_auditd_required
    - rhel_09_653110
  tags: always
  ansible.builtin.find:
    path: /etc/audit/rules.d
    patterns: '*.rules'
  register: discovered_audit_rules

# Added to ensure ssh drop in file exists if not default /etc/ssh/sshd_config
- name: PRELIM | SSH | create config file if absent
  when:
    - rhel9stig_sshd_required
    - rhel9stig_sshd_config_file != '/etc/ssh/sshd_config'
    - "'openssh-server' in ansible_facts.packages"
  tags: ssh
  ansible.builtin.file:
    path: "{{ rhel9stig_sshd_config_file }}"
    owner: root
    group: root
    mode: 'u-x,go-rwx'
    state: touch

- name: PRELIM | SSH | find existing ssh config files
  tags: always
  ansible.builtin.find:
    paths:
      - /etc/ssh/
      - /etc/ssh/sshd_config.d
    patterns: 'sshd_config,*.conf'
    recurse: false
  register: prelim_sshd_config_files

- name: "PRELIM | Update crypto-policies"
  when: rhel_09_672020
  tags:
    - RHEL-09-672020
    - fips
    - crypto
    - not system_is_container
  ansible.builtin.package:
    name: crypto-policies
    state: latest

- name: "PRELIM | Capture NetworkManager DNS state"
  when: rhel_09_252035 or rhel_09_252040
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    grep -E "dns\s*=" /etc/NetworkManager/NetworkManager.conf | cut -d = -f2 | sed s/" "//g
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  failed_when: prelim_network_manager_dns.rc not in [ 0, 1, 2 ]
  register: prelim_network_manager_dns

- name: PRELIM | Discover Gnome Desktop Environment
  tags: always
  ansible.builtin.stat:
    path: /usr/share/gnome/gnome-version.xml
  register: prelim_gnome_present

- name: PRELIM | Discover dconf systemdb
  when: rhel9stig_gui
  ansible.builtin.shell: |
    set -o pipefail
    grep system-db /etc/dconf/profile/user | cut -d ':' -f2
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  changed_when: false
  failed_when: prelim_dconf_db.rc not in [ 0, 1 ]
  register: prelim_dconf_db

- name: PRELIM | Discover dconf db files
  when: rhel9stig_gui
  ansible.builtin.find:
    path: /etc/dconf/db/local.d
    pattern: '*'
  register: prelim_dconf_locald_files

- name: PRELIM | Find all sudoers files.
  when:
    - rhel_09_431016 or
      rhel_09_432015 or
      rhel_09_432020 or
      rhel_09_432025 or
      rhel_09_432030
  tags: always
  ansible.builtin.command: find /etc/sudoers /etc/sudoers.d/ -type f ! -name '*~' ! -name '*.*'
  changed_when: false
  failed_when: false
  check_mode: false
  register: prelim_sudoers_files

- name: PRELIM | Find all pwquality files.
  when:
    - rhel_09_611100 or
      rhel_09_611060 or
      rhel_09_611065 or
      rhel_09_611070
  tags: always
  ansible.builtin.shell: |
    set -o pipefail
    find /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
  args:
    executable: "{{ rhel9stig_shell_executable }}"
  check_mode: false
  changed_when: false
  failed_when: prelim_pwquality_conf_files.rc not in [ 0, 1 ]
  register: prelim_pwquality_conf_files

- name: "PRELIM | Discover the authselect profile and features in use"
  tags: always
  ansible.builtin.command: authselect current --raw
  changed_when: false
  failed_when: false
  check_mode: false
  register: prelim_authselect_current

- name: "PRELIM | Set authselect discovery facts"
  tags: always
  ansible.builtin.set_fact:
    prelim_authselect_profile: "{{ (prelim_authselect_current.stdout | default('')).split() | first | default('') }}"
    prelim_authselect_features: "{{ (prelim_authselect_current.stdout | default('')).split()[1:] }}"

- name: "PRELIM | Decide whether PAM is configured through authselect"
  tags: always
  ansible.builtin.set_fact:
    rhel9stig_pam_via_authselect: "{{ (rhel9stig_uses_authselect | bool or not rhel9stig_add_faillock_without_authselect | bool) and prelim_authselect_current.rc | default(1) == 0 and prelim_authselect_profile | length > 0 and (prelim_authselect_profile == 'custom/' ~ rhel9stig_authselect_custom_profile or (rhel9stig_disruption_high and not ansible_check_mode)) }}"

- name: "PRELIM | Set the PAM configuration directory"
  tags: always
  ansible.builtin.set_fact:
    rhel9stig_pam_confd_dir: "{{ ('/etc/authselect/custom/' ~ rhel9stig_authselect_custom_profile) if rhel9stig_pam_via_authselect else '/etc/pam.d' }}"

- name: "PRELIM | AUDIT | Warn that authselect was requested but PAM is edited directly"
  when:
    - rhel9stig_uses_authselect | bool or not rhel9stig_add_faillock_without_authselect | bool
    - not rhel9stig_pam_via_authselect
  tags: always
  ansible.builtin.debug:
    msg:
      - "Warning!! rhel9stig_uses_authselect is true but PAM will be edited under /etc/pam.d"
      - "Either authselect is not managing this host, or moving it onto custom/{{ rhel9stig_authselect_custom_profile }} needs rhel9stig_disruption_high and a run outside check mode"
      - "authselect current reported: {{ prelim_authselect_current.stdout | default(prelim_authselect_current.msg | default('')) }}"

- name: "PRELIM | Move PAM onto the authselect custom profile"
  when:
    - rhel9stig_pam_via_authselect
    - prelim_authselect_profile != 'custom/' ~ rhel9stig_authselect_custom_profile
  tags: always
  block:
    - name: "PRELIM | Move PAM onto the authselect custom profile | Check for the custom profile"
      ansible.builtin.stat:
        path: "/etc/authselect/custom/{{ rhel9stig_authselect_custom_profile }}"
      register: prelim_authselect_custom_profile_dir

    - name: "PRELIM | PATCH | Move PAM onto the authselect custom profile | Create it from the profile in use"
      when: not prelim_authselect_custom_profile_dir.stat.exists
      ansible.builtin.command: "authselect create-profile {{ rhel9stig_authselect_custom_profile }} -b {{ prelim_authselect_profile }} --symlink-meta"
      changed_when: true

    - name: "PRELIM | PATCH | Move PAM onto the authselect custom profile | Select it keeping the features in use"
      ansible.builtin.command: "authselect select custom/{{ rhel9stig_authselect_custom_profile }} {{ prelim_authselect_features | join(' ') }}{{ ' --force' if rhel9stig_authselect_force_select else '' }}"
      changed_when: true

- name: "PRELIM | RHEL-09-411080 | RHEL-09-411085 | RHEL-09-411090 | RHEL-09-611030 | RHEL-09-611035 | PATCH | Enable the authselect faillock feature"
  when:
    - rhel_09_411080 or rhel_09_411085 or rhel_09_411090 or rhel_09_611030 or rhel_09_611035
    - rhel9stig_pam_via_authselect
    - rhel9stig_disruption_high
    - "'with-faillock' not in prelim_authselect_features"
  tags: always
  ansible.builtin.command: authselect enable-feature with-faillock
  changed_when: true

- name: PRELIM | Discover removable devices
  when: item.value.removable == '1'
  tags: always
  ansible.builtin.set_fact:
    rhel9stig_discovered_removable_storage: "{{ rhel9stig_discovered_removable_storage | default([]) + [item.key] }}"
  loop: "{{ ansible_facts['devices'] | dict2items }}"

- name: PRELIM | Gather the package facts after prelim
  tags: always
  ansible.builtin.package_facts:
    manager: auto
