---

# Molecule verifier for the RHEL 9 STIG role.
#
# Container-aware by design. Most STIG controls (auditd rules, file modes on
# audit config) are gated off in a container via vars/is_container.yml
# (rhel9stig_auditd_required: false), so /etc/audit/rules.d/audit.rules stays
# the stock package default. These assertions therefore only fire when the
# artifact was actually managed on the target (detected by the template's
# "# RHEL9-STIG rule" marker), so the play validates on a real host and skips
# cleanly in a container instead of false-failing. Live `auditctl -l` is never
# asserted (rules are not loaded in an unprivileged container).
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check whether the audit rules file is present
      ansible.builtin.stat:
        path: /etc/audit/rules.d/audit.rules
      register: verify_audit_rules_stat

    - name: Read the deployed audit rules file
      ansible.builtin.slurp:
        src: /etc/audit/rules.d/audit.rules
      register: verify_audit_rules
      when: verify_audit_rules_stat.stat.exists

    - name: Determine whether the audit rules were managed by this role
      ansible.builtin.set_fact:
        verify_audit_rules_text: "{{ (verify_audit_rules.content | b64decode) if verify_audit_rules_stat.stat.exists else '' }}"

    - name: Note when the audit rules file is absent - audit assertions skipped
      ansible.builtin.debug:
        msg: "/etc/audit/rules.d/audit.rules does not exist (the audit package is subscription-gated on UBI); skipping audit-rule assertions"
      when: not verify_audit_rules_stat.stat.exists

    - name: Note when auditd is unmanaged (e.g. container) - audit assertions skipped
      ansible.builtin.debug:
        msg: "auditd rules not managed on this target (stock file); skipping audit-rule assertions"
      when:
        - verify_audit_rules_stat.stat.exists
        - "'# RHEL9-STIG rule' not in verify_audit_rules_text"

    - name: RHEL-09-654215..654255 | V2R9 syscall identity/logins rules present
      ansible.builtin.assert:
        quiet: true
        that:
          - "'-a always,exit -F arch=b32 -F path=/etc/sudoers -F perm=wa -k identity' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b64 -F path=/etc/sudoers -F perm=wa -k identity' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b32 -F path=/etc/sudoers.d -F perm=wa -k identity' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b32 -F path=/etc/security/opasswd -F perm=wa -k identity' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b32 -F path=/etc/passwd -F perm=wa -k identity' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b32 -F path=/var/log/faillock -F perm=wa -F auid>=1000 -F auid!=unset -k logins' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b64 -F path=/var/log/lastlog -F perm=wa -F auid>=1000 -F auid!=unset -k logins' in verify_audit_rules_text"
        fail_msg: "V2R9 syscall audit rules (654215-654255) missing from a managed /etc/audit/rules.d/audit.rules"
      when: "'# RHEL9-STIG rule' in verify_audit_rules_text"

    - name: RHEL-09-654097 | V2R9 crond_t execve audit rules present
      ansible.builtin.assert:
        quiet: true
        that:
          - "'-a always,exit -F arch=b64 -S execve -F subj_type=crond_t -F euid=0 -k cron_exec' in verify_audit_rules_text"
          - "'-a always,exit -F arch=b32 -S execve -F subj_type=crond_t -F auid>=1000 -F auid!=unset -k cron_exec' in verify_audit_rules_text"
        fail_msg: "V2R9 crond_t execve audit rules (654097) missing from a managed audit.rules"
      when: "'# RHEL9-STIG rule' in verify_audit_rules_text"

    - name: V2R9 | obsolete watch-style audit rules removed
      ansible.builtin.assert:
        quiet: true
        that:
          - "'-w /etc/sudoers -p wa -k identity' not in verify_audit_rules_text"
          - "'-w /var/log/faillock -p wa -k logins' not in verify_audit_rules_text"
          - "'-w /etc/cron.d -p wa -k cronjobs' not in verify_audit_rules_text"
        fail_msg: "Obsolete watch-style audit rules still present in the managed template output"
      when: "'# RHEL9-STIG rule' in verify_audit_rules_text"

    - name: RHEL-09-653110 | collect audit config file modes
      ansible.builtin.shell: >-
        find /etc/audit/rules.d/ /etc/audit/audit.rules /etc/audit/auditd.conf
        -type f -exec stat -c '%a' {} \;
      register: verify_audit_modes
      changed_when: false
      when: "'# RHEL9-STIG rule' in verify_audit_rules_text"

    - name: RHEL-09-653110 | assert no audit config file is more permissive than 0600
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_audit_modes.stdout_lines | reject('match', '^[0-6]00$') | list | length == 0
        fail_msg: "An audit config file is more permissive than 0600: {{ verify_audit_modes.stdout_lines | default([]) }}"
      when:
        - "'# RHEL9-STIG rule' in verify_audit_rules_text"
        - verify_audit_modes.stdout_lines is defined

    - name: RHEL-09-211045 | Ctrl-Alt-Del burst drop-in (.conf suffix)
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction.conf
      register: verify_cad_conf

    - name: RHEL-09-211045 | old suffixless drop-in must never exist
      ansible.builtin.stat:
        path: /etc/systemd/system.conf.d/55-CtrlAltDel-BurstAction
      register: verify_cad_old

    - name: RHEL-09-211045 | the old suffixless drop-in path is absent
      ansible.builtin.assert:
        quiet: true
        that:
          - not verify_cad_old.stat.exists
        fail_msg: "The pre-V2R9 suffixless Ctrl-Alt-Del drop-in still exists"

    - name: RHEL-09-211045 | when the control applied, the .conf drop-in exists
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_cad_conf.stat.exists
        fail_msg: "211045 Ctrl-Alt-Del drop-in is not at the required .conf path"
      when: verify_cad_conf.stat.exists or verify_cad_old.stat.exists

    - name: RHEL-09-255120 | collect SSH private host key modes
      ansible.builtin.shell: "stat -c '%a' /etc/ssh/*_key"
      register: verify_ssh_key_modes
      changed_when: false
      failed_when: false

    - name: RHEL-09-255120 | assert SSH private host keys are 0600 or less permissive
      ansible.builtin.assert:
        quiet: true
        that:
          - verify_ssh_key_modes.stdout_lines | reject('match', '^[0-6]00$') | list | length == 0
        fail_msg: "An SSH private host key is more permissive than 0600: {{ verify_ssh_key_modes.stdout_lines }}"
      when: verify_ssh_key_modes.rc == 0 and verify_ssh_key_modes.stdout | length > 0
