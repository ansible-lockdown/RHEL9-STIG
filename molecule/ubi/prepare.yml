---

- name: Prepare RHEL 9 STIG molecule host (UBI 9)
  hosts: all
  gather_facts: false
  tasks:
    - name: Bootstrap python, sudo, iproute, openssh via raw (installs only what is missing)
      # Asks dnf only for packages that are genuinely absent. `dnf install <pkg>` on an already
      # installed package is not a no-op on dnf5: when the repositories carry a newer build than
      # the image ships, it tries to resolve an upgrade, finds it cannot install the best
      # candidate, and exits non-zero. Both test images track moving tags while the repository
      # metadata moves independently, so that drift is routine rather than exceptional.
      ansible.builtin.raw: |
        set -e
        missing=
        for pkg in python3 sudo iproute openssh-server openssh-clients procps-ng; do
          rpm -q "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
        done
        if [ -n "$missing" ]; then
          echo "bootstrapping:$missing"
          dnf install -y $missing
        else
          echo "bootstrap: all present"
        fi
      changed_when: false

    - name: Gather facts now that python is present
      ansible.builtin.setup:

    - name: Install RHEL 9 STIG supporting packages (UBI subset - some packages unavailable)
      ansible.builtin.dnf:
        name:
          - audit
          - aide
          - crypto-policies
          - crypto-policies-scripts
          - firewalld
          - policycoreutils
          - policycoreutils-python-utils
          - selinux-policy-targeted
          - chrony
          - rsyslog
          - logrotate
          - cronie
          - acl
          - kmod
          - dnf-plugins-core
          - python3-libselinux
          - python3-policycoreutils
          - tmux
          - git
        state: present
      # UBI repos do not carry every package in this list, so a partial install is the
      # expected outcome here, not an error to swallow. failed_when: false states that
      # directly; ignore_errors: true would mark the task failed and then continue,
      # which is what ansible-lint's ignore-errors rule flags.
      failed_when: false

    - name: Create directories that minimal images lack (UBI also stubs audit/aide dirs since those packages are subscription-gated)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/sysctl.d
        - /etc/ssh/sshd_config.d
        - /run/sshd
        - /var/log/audit
        - /etc/audit
        - /etc/audit/rules.d
        - /etc/aide
        - /etc/aide/aide.conf.d

    - name: Stub /etc/default/grub so GRUB-tag tasks do not fail in container
      ansible.builtin.copy:
        dest: /etc/default/grub
        content: |
          GRUB_TIMEOUT=5
          GRUB_DISTRIBUTOR="$(sed 's, release .*$,,g' /etc/system-release)"
          GRUB_DEFAULT=saved
          GRUB_DISABLE_SUBMENU=true
          GRUB_TERMINAL_OUTPUT="console"
          GRUB_CMDLINE_LINUX=""
          GRUB_DISABLE_RECOVERY="true"
          GRUB_ENABLE_BLSCFG=true
        mode: '0644'
