---
dependency:
  name: galaxy
  options:
    requirements-file: collections/requirements.yml
driver:
  name: docker
platforms:
  - name: rhel9-stig-ubi
    image: redhat/ubi9-init:latest
    # The image is multi-arch. Default keeps local Apple Silicon runs on arm64;
    # CI exports MOLECULE_DOCKER_PLATFORM=linux/amd64 for GitHub-hosted runners.
    platform: "${MOLECULE_DOCKER_PLATFORM:-linux/arm64}"
    pre_build_image: true
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
provisioner:
  name: ansible
  log: true
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
  inventory:
    host_vars:
      rhel9-stig-ubi:
        ansible_become: false
        setup_audit: true
        run_audit: true
        # audit_git_version intentionally omitted: vars/audit.yml derives it from
        # benchmark_version via include_vars (which outranks play/host vars), so a
        # value here is inert. Pin a QA branch at run time with:
        #   molecule converge -s ubi -- --extra-vars 'audit_git_version=<branch>'
        skip_reboot: true
        system_is_container: true
        rhel9stig_disruption_high: false
verifier:
  name: ansible
